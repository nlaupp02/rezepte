// Das Rezept wird als A4-Seite(n) gezeichnet. Auf dem iPhone geht es damit ins Teilen-Menü (dort steht „Drucken“):
// Die App vom Home-Bildschirm führt window.print() nicht aus. Am Computer öffnet sich der normale Druckdialog.
function recipePages(r) {
  const W = 1240, H = 1754, M = 110; // A4 bei 150 dpi
  const SANS = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif', SERIF = 'Georgia, "Times New Roman", serif';
  const pages = []; let c = null, y = 0;
  const page = () => { const cv = document.createElement("canvas"); cv.width = W; cv.height = H; c = cv.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, W, H); c.textBaseline = "top"; pages.push(cv); y = M; };
  const put = (text, o) => {
    o = o || {};
    const size = o.size || 27, lh = Math.round(size * 1.42), x = M + (o.indent || 0), width = W - M - x;
    const font = `${o.bold ? "700" : "400"} ${size}px ${o.serif ? SERIF : SANS}`;
    c.font = font;
    const lines = []; let cur = "";
    String(text).split(/\s+/).filter(Boolean).forEach(w => {
      while (c.measureText(w).width > width && w.length > 1) { // ein Wort breiter als die Zeile (langer Link): hart umbrechen
        let k = w.length - 1; while (k > 1 && c.measureText(w.slice(0, k)).width > width) k--;
        if (cur) { lines.push(cur); cur = ""; }
        lines.push(w.slice(0, k)); w = w.slice(k);
      }
      const t = cur ? cur + " " + w : w;
      if (cur && c.measureText(t).width > width) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    lines.forEach((l, i) => {
      if (y + lh > H - M) { page(); c.font = font; }
      c.fillStyle = o.color || "#111";
      if (!i && o.mark) c.fillText(o.mark, M, y);
      c.fillText(l, x, y); y += lh;
    });
    y += o.gap || 0;
  };
  page();
  put(r.title || "Rezept", { size: 50, bold: true, serif: true, gap: 10 });
  const base = Number(r.servings) > 0 ? Number(r.servings) : null;
  const facts = [base ? servText(base, r.category) : "", r.prepTime ? "Vorbereitung " + r.prepTime : "", r.cookTime ? servWords(r.category).time + " " + r.cookTime : ""].filter(Boolean);
  if (facts.length) put(facts.join("  ·  "), { size: 24, color: "#555" });
  y += 34;
  const ings = r.ingredients || [];
  if (ings.length) {
    put("Zutaten", { size: 32, bold: true, gap: 10 });
    ings.forEach(l => { if (isHead(l)) { y += 10; put(headText(l), { bold: true, gap: 4 }); } else { const q = splitQty(l, 1); put(q.qty + q.rest, { indent: 34, mark: "•", gap: 4 }); } });
    y += 30;
  }
  const steps = r.steps || [];
  if (steps.length) {
    put("Zubereitung", { size: 32, bold: true, gap: 10 });
    let n = 0;
    steps.forEach(st => { if (/^#/.test(st)) { y += 10; put(headText(st), { bold: true, gap: 4 }); } else put(st, { indent: 50, mark: (++n) + ".", gap: 12 }); });
    y += 18;
  }
  if (r.notes) { put("Notizen", { size: 32, bold: true, gap: 10 }); String(r.notes).split(/\n+/).forEach(p => put(p, { gap: 8 })); y += 18; }
  const src = [r.source, r.link].filter(Boolean).join(" · ");
  if (src) put("Quelle: " + src, { size: 21, color: "#555" });
  return pages;
}
function canvasFile(cv, name) {
  const d = cv.toDataURL("image/png"), bin = atob(d.slice(d.indexOf(",") + 1)), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new File([u8], name, { type: "image/png" });
}
function printRecipe(r) {
  if (!r) return;
  let pages = [];
  try { pages = recipePages(r); } catch (e) { pages = []; }
  if (!pages.length) { toast("Das Rezept ließ sich nicht fürs Drucken vorbereiten."); return; }
  const ios = navigator.standalone === true || /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && navigator.share) { // gleich beim Tippen und ohne Warten, sonst lässt iOS das Teilen-Menü nicht zu
    try {
      const name = (r.title || "Rezept").replace(/[^\wäöüÄÖÜß \-]+/g, "").trim().slice(0, 40) || "Rezept";
      const files = pages.map((cv, i) => canvasFile(cv, name + (pages.length > 1 ? " " + (i + 1) : "") + ".png"));
      if (!navigator.canShare || navigator.canShare({ files })) { navigator.share({ files }).catch(() => {}); return; }
    } catch (e) { /* weiter mit dem Druckdialog */ }
  }
  let box = document.getElementById("print");
  if (!box) { box = document.createElement("div"); box.id = "print"; document.body.appendChild(box); }
  box.innerHTML = "";
  const imgs = pages.map(cv => { const im = new Image(); im.alt = ""; im.src = cv.toDataURL("image/png"); box.appendChild(im); return im; });
  Promise.all(imgs.map(im => im.decode ? im.decode().catch(() => {}) : null)).then(() => {
    try { window.print(); } catch (e) { toast("Drucken geht auf diesem Gerät nicht."); }
  });
}

    .some(w => t.includes(w.slice(0, Math.max(4, w.length - 2))));

}

  const ings = (r.ingredients || []).map(l => isHead(l) ? "\n" + headText(l) + ":" : "• " + (s => s.qty + s.rest)(splitQty(l, factor)));
  if (ings.length) out.push("", "Zutaten", ...ings);
  let n = 0;
  const steps = (r.steps || []).map(st => /^#/.test(st) ? "\n" + headText(st) + ":" : (++n) + ". " + st);
  if (steps.length) out.push("", "Zubereitung", ...steps);
  if (r.notes) out.push("", "Notizen", r.notes);
  if (r.source || r.link) out.push("", ["Quelle: " + (r.source || ""), r.link || ""].filter(x => x && x !== "Quelle: ").join("\n"));
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function estimateNutrition(r) {
  const base = Number(r.servings) > 0 ? Number(r.servings) : null;
  const nw = servWords(r.category);
  const prompt = `Schätze die Nährwerte für jede Zutat dieses Rezepts${base ? ` (es ist für ${servText(base, r.category)})` : ""}.
Antworte nur mit JSON: {"items": ${NUTRI_ITEMS}}

Rezept: ${r.title || ""}
Zutaten:
${(r.ingredients || []).filter(l => !isHead(l)).map(l => "- " + l).join("\n")}`;
  void nw;
  const res = await sample.json(prompt, { cache: false }); // Sonnet: trifft vor allem Salz bei Käse, Speck und Fertigprodukten besser als Haiku; läuft im Hintergrund
  return nutritionFromItems(res && res.items, base) || cleanNutrition(res); // ältere Antwortform zur Sicherheit
}

async function saveRecipe() {
  const ed = state.edit;
  if (!ed || ed.saving) return;
  const d = ed.data;
  const title = d.title.trim();
  if (!title) {
    const w = $("#w-title"); if (w) { w.classList.add("bad"); $("#f-title").focus(); }
    toast("Gib dem Rezept einen Titel.");
    return;
  }
  if (!col) { toast("Melde dich an, um Rezepte zu speichern."); return; }
  ed.saving = true;
  $$("[data-action=save]").forEach(b => { b.disabled = true; b.textContent = "Speichert …"; });
  try {
    let cover = d.cover || null;
    if (ed.coverBlob) cover = await storeCover(ed.coverBlob);
    else if (ed.removeCover) cover = null;
    const sv = parseFloat(String(d.servings).replace(",", "."));
    const now = Date.now();
    // Nur die Felder aus dem Formular. Sterne, Favorit, Nährwerte usw. bleiben, wie sie gerade (auch vom anderen Gerät) sind.
    const doc = {
      title, category: d.category,
      servings: sv > 0 && sv < 1000 ? sv : null,
      prepTime: d.prepTime.trim(), cookTime: d.cookTime.trim(),
      ingredients: linesOf(d.ingredientsText), steps: linesOf(d.stepsText).map(stripNo),
      notes: d.notes.trim(), source: d.source.trim(), cover, updatedAt: now,
      unsure: [] // im Editor gespeichert: gilt als geprüft
    };
    const id = ed.id || newId();
    const existing = ed.id ? state.recipes.find(r => r.id === ed.id) : null;
    const sameIngs = !!existing && JSON.stringify(existing.ingredients || []) === JSON.stringify(doc.ingredients) && (existing.servings || null) === doc.servings;
    if (existing && !sameIngs) { doc.nutrition = null; nutriTried.delete(id); }
    if (!existing || !sameIngs || existing.prepTime !== doc.prepTime || existing.cookTime !== doc.cookTime || JSON.stringify(existing.steps || []) !== JSON.stringify(doc.steps)) {
      doc.tags = null; tagDone.delete(id); // werden im Hintergrund neu bestimmt
    }
    // Zeit von Hand geändert oder gelöscht: gilt so, wird nicht (mehr) geschätzt
    if (existing && ((existing.prepTime || "") !== doc.prepTime || (existing.cookTime || "") !== doc.cookTime)) { doc.timeEst = false; timeDone.add(id); }
    if (!existing) Object.assign(doc, { link: d.link.trim(), favorite: false, createdAt: now, rating: 0, nutrition: cleanNutrition(d.nutrition), viewedAt: null, timeEst: d.timeEst ? true : null });
    else doc.createdAt = existing.createdAt || now; // ohne createdAt taucht ein Rezept nicht in der Liste auf (z. B. wenn es parallel auf dem anderen Handy gelöscht wurde)
    await withRetry(() => col.doc(id).set(doc, true));
    const i = state.recipes.findIndex(r => r.id === id);
    const local = Object.assign({ id }, existing || {}, doc);
    if (i >= 0) state.recipes[i] = local; else state.recipes.unshift(local);
    state.edit = null;
    if (ed.coverUrl) URL.revokeObjectURL(ed.coverUrl);
    if (existing && histBack({ resetTicks: !sameIngs })) { /* zurück zum Rezept, Haken bleiben bei gleichen Zutaten */ }
    else if (!existing && histDepth() > 0) { state.currentId = id; histReplace("detail"); openDetail(id, { nohist: true }); } // neu: der Editor-Eintrag wird zum Rezept
    else if (sameIngs && state.currentId === id) go("detail", { nohist: true }); else openDetail(id, { nohist: true });
    toast("Gespeichert");
  } catch (e) {
    ed.saving = false;
    $$("[data-action=save]").forEach((b, k) => { b.disabled = false; b.textContent = k ? "Rezept speichern" : "Speichern"; });
    toast(e && e.code ? dbErrorText(e) : "Das Foto ließ sich nicht verarbeiten. Nimm ein anderes oder speichere ohne Foto.");
  }
}

function buildPrompt(imp, n) {
  const t = imp.text.trim();

  let material;

      (n ? ` und ${n > 1 ? `Vorschaubilder des Videos (Bild 1 bis ${n})` : "das Vorschaubild des Videos (Bild 1)"}. Text-Einblendungen im Bild gehören auch zum Rezept. Als "coverImage" nimm ein Bild, auf dem kein Play-Knopf (Dreieck im Kreis) und kein anderes Symbol eingeblendet ist, wenn es so eins gibt; sonst das Bild, das das Gericht am besten zeigt` : "") +
      `. Steht in der Beschreibung (und im Bild) kein Rezept mit Zutaten, setz "isRecipe" auf false und schreib in "problem", dass das Rezept wohl nur im Video gezeigt wird. Als "source" nimmst du den Kanal, z. B. "@kanalname".`;
  } else if (imp.mode === "photo") {
    material = `Das Material sind ${n} Foto(s) (Bild 1 bis ${n}) eines Rezepts, z. B. aus einem Kochbuch, einer Zeitschrift, von einem Zettel oder handschriftlich. Mehrere Bilder gehören meist zum selben Rezept (mehrere Seiten, Vorder- und Rückseite). Sind erkennbar verschiedene Rezepte zu sehen (z. B. eine Doppelseite mit zwei Gerichten), lies das erste vollständige und nenne die Titel der anderen in "otherRecipes".`;
  } else if (imp.page) {
    material = `Das Material ist der Inhalt einer Rezept-Webseite (Link und Text unten).`;
  } else {
    material = `Das Material ist ein eingefügter Text, z. B. aus WhatsApp, einer E-Mail oder einer Instagram-Beschreibung` + (n ? `, und ${n} Bild(er)` : "") + `.`;
  }
  return `Du hilfst einer Kochbuch-App, Rezepte zu speichern. ${material}

Lies das Rezept heraus und antworte nur mit einem JSON-Objekt mit diesen Feldern${transcribe ? " (in dieser Reihenfolge)" : ""}:
${transcribe ? `- "transcript": zuerst eine genaue Abschrift, so wie es ${imp.mode === "insta" ? "als Text in den Bildern" : "auf den Bildern"} steht, in der Originalsprache: die Zutatenliste Zeile für Zeile mit allen Mengen und Einheiten (mit Zwischenüberschriften; steht keine eigene Liste da, die Sätze, in denen Zutaten mit Mengen vorkommen), danach aus der Zubereitung nur die Stellen mit Zahlen (Temperaturen, Zeiten, Mengen), wörtlich. Lies dabei Ziffer für Ziffer; die anderen Felder füllst du danach.${imp.mode === "insta" ? " Steht in den Bildern kein Text, leer." : ""}
` : ""}- "isRecipe": true oder false
- "problem": leer, oder kurz auf Deutsch, warum kein Rezept erkennbar ist (z. B. unscharf, abgeschnitten, nur ein Video-Standbild ohne Text)
- "title": Rezeptname auf Deutsch, wie er in einem deutschen Kochbuch stehen würde: zuerst das Gericht, dann mit „mit“ die wichtigsten Zutaten, z. B. „Ofenpasta mit Spinat und Tomaten“ oder „Bananen-Brownie mit Schoko und Hafer“. Keine langen Bindestrich-Ketten wie „Spinat-Tomaten-Ofenpasta“. Höchstens etwa 6 Wörter. Ohne Werbewörter wie „High-Protein“, „einfach“, „lecker“, „schnell“, „gesund“ oder „aus dem Ofen“, ohne Hashtags und Emojis. Englische Gerichtsnamen schreibst du richtig, z. B. „Mac and Cheese“, „One-Pot-Pasta“ (nicht „Pasta One Pot“).
- "category": genau eins von: ${CATEGORIES.join(", ")}
- "servings": für wie viele Personen bzw. Portionen das Rezept ist, als Zahl. Bei Kuchen, Torten, Gebäck und Brot (Kategorie Backen) ist es die Anzahl der Stücke, z. B. 12 für einen Kuchen in der Springform. Bei Getränken die Anzahl Gläser, bei Snacks wie Energy Balls oder Riegeln und bei Sonstigem (z. B. Pesto, Gewürzmischung) die Anzahl Portionen. Steht nichts dabei, schätze sie aus den Mengen, wie viele davon üblicherweise satt werden (z. B. 500 g Nudeln für 4 Personen, eine Springform für 12 Stücke), und trag das in "unsure" ein. null nur, wenn sich gar nichts schätzen lässt
- "prepTime": Vorbereitungszeit wie "15 Min." oder "1 Std. 10 Min.". Ruhe-, Geh-, Kühl- und Marinierzeiten gehören weder hierher noch in "cookTime", sondern in die Schritte
- "cookTime": Koch- bzw. Backzeit im selben Format
- "timeEstimated": true oder false. Steht im Material eine Zeit, übernimm nur, was dasteht (was fehlt, bleibt ""), und setz false. Steht gar keine Zeit da, schätze "prepTime" und "cookTime" so, wie sie in einem Kochbuch stünden, und setz true: die Vorbereitung aus dem, was zu schneiden, zu rühren und vorzubereiten ist, die Koch- bzw. Backzeit aus den Zeiten in den Schritten (z. B. „20 Minuten backen“) oder dem, was für das Gericht üblich ist ("" wenn nichts gekocht oder gebacken wird). Geschätzte Zeiten auf 5 Minuten gerundet und ohne „ca.“
- "ingredients": Liste von Strings, eine Zutat pro Eintrag, Menge zuerst, z. B. "200 g Mehl", "2 EL Olivenöl", "1 TL Zimt". Steht keine Menge dabei, schreib die Zutat ohne Menge, z. B. "Salz", "Pfeffer nach Geschmack", "etwas Öl zum Braten", und erfinde keine. Schreib Mengen möglichst genau in g oder ml. Packungen, Dosen, Becher, Gläser und Tüten rechnest du in g oder ml um und schreibst die Packung in Klammern dahinter, z. B. "500 g Gnocchi (1 Packung)", "400 g gehackte Tomaten (1 Dose)", "200 g Sahne (1 Becher)"; ist das Gewicht nicht angegeben, nimm die übliche Packungsgröße in Deutschland mit „ca.“. Stückzutaten bleiben Stück, z. B. "2 Eier", "1 Zwiebel", "3 Knoblauchzehen". Steht bei Gewürzen eine Menge, schreib sie in EL, TL oder Prise. Die Menge steht immer ganz vorne, z. B. "1 Zitrone (Saft)" statt "Saft von 1 Zitrone". Zwischenüberschriften als eigener Eintrag mit "# " davor, z. B. "# Für die Soße".
- "steps": Liste von Strings, ein Arbeitsschritt pro Eintrag, ohne Nummerierung. Bei Teilrezepten Zwischenüberschriften wie bei den Zutaten als eigener Eintrag mit "# " davor, z. B. "# Teig", "# Füllung", "# Fertigstellen". Backofen: Temperatur und Betriebsart so übernehmen, wie sie dastehen, z. B. "Ofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen"; stehen beide, beide nennen, steht nur eine, nur diese, nichts umrechnen (nur Gasherd-Stufen und °F in °C)
- "notes": Tipps, Hinweise, Varianten und Austausch-Tipps aus dem Rezept ("statt Sahne geht auch …", "vegane Variante: …"), sonst "". Bei "A oder B" in den Zutaten nimm A und nenn B hier. Keine Bemerkungen dazu, woher du etwas hast oder wie du gelesen hast (z. B. „die Zeit stammt aus dem Titel im Bild“)
- "otherRecipes": Titel weiterer, eigenständiger Rezepte im Material (z. B. das zweite Gericht einer Doppelseite), sonst leere Liste. Nicht gemeint sind Teilrezepte des Gerichts wie Soße oder Teig
- "source": Buchtitel, Website oder Instagram-Kanal (z. B. "@kanalname"), falls erkennbar, sonst ""
- "coverImage": Nummer des Bildes (ab 1), das als Titelbild taugt, weil darauf ein echtes Foto des fertigen Gerichts zu sehen ist. Bilder, die vor allem Text zeigen (Rezeptseite, Zettel, Handschrift, Screenshot einer Beschreibung oder App), nimmst du nicht. Auch keinen Screenshot, auf dem das Essen nur klein oder nebenbei zu sehen ist (z. B. oben ein kleines Video, darunter Text), und kein Bild, das nur Zutaten oder einen Zubereitungsschritt statt des fertigen Gerichts zeigt. Gibt es kein solches Bild, null
${imp.mode === "photo" ? `- "coverBox": Ist auf dem gewählten Bild außer dem Gericht noch anderes zu sehen (Text, Seitenrand, Knöpfe einer App), dann der Ausschnitt nur mit dem Gericht als [links, oben, rechts, unten] in Prozent der Bildbreite bzw. -höhe, so groß wie möglich. Zeigt fast das ganze Bild das Gericht, null
` : ""}- "originalLanguage": Sprache des Originals auf Deutsch, z. B. "Deutsch", "Englisch", "Serbisch", "Ungarisch"
- "tags": Liste der Merkmale, die sicher zutreffen, nur aus: ${TAGS.join(", ")} (${TAG_RULES}). Leere Liste, wenn keins passt.

async function recognize() {
  const imp = state.imp;
  if (!imp) return;
  await initPromise;
  if (!sample) { showError("Lesen geht gerade nicht.", "Lade die App neu und versuch es nochmal."); return; }
  const raw = imp.link.trim();
  const m = raw.match(/https?:\/\/[^\s.]+\.\S+/);
  if (m) { m[0] = m[0].replace(/[.,;:!?'"»]+$/, ""); if (!/\(/.test(m[0])) m[0] = m[0].replace(/\)+$/, ""); } // „…html.“ oder „(…)“
  const rest = m ? raw.replace(m[0], "").trim() : raw;
  if (!raw) { showError(imp.mode === "insta" ? "Füg zuerst den Link zum Reel ein." : "Füg zuerst einen Link oder Text ein.", imp.mode === "insta" ? "Im Reel: Teilen → Link kopieren." : ""); return; }
  if (imp.mode === "insta" && !m) { showError("Das ist kein Link.", "Im Reel: Teilen → Link kopieren, dann hier auf „Einfügen“ tippen."); return; }
  if (m && rest.length < 100 && !/\n/.test(rest)) {
    const src = { mode: "link", text: "", link: m[0], images: [] }, lk = linkKey(m[0]);
    if (lk && state.jobs.some(j => j.status !== "error" && linkKey(j.src.link) === lk)) toast("Ist schon oben in der Liste.");
    else {
      const sim = lk && state.recipes.find(r => linkKey(r.link) === lk);
      if (sim) { // schon gespeichert: nicht lesen (spart Guthaben), erst fragen
        const job = newJob(src, "dup"); job.dup = { id: sim.id, title: sim.title || "" };
        jobStore("put", jobRecord(job));
      } else startJob(src);
    }
  }
  else if (raw.length < 40) { showError("Das ist zu wenig für ein Rezept.", "Füg den ganzen Rezepttext oder einen Link ein."); return; }
  else startJob({ mode: "text", text: raw.slice(0, 20000), link: m ? m[0] : "", images: [] });
  state.imp = null;
  if (!histBack()) go("list", { nohist: true });
}

  "new-set-for": () => newSetFor(),
  "new-set": () => { if (col) startNewSet(); },
  "edit-set": () => { if (state.filter.startsWith("set:")) editSet(state.filter.slice(4)); },
  "set-pick": el => {
    const se = state.setEdit; if (!se) return;
    const id = el.dataset.id, on = !se.sel.has(id);
    if (on) se.sel.add(id); else se.sel.delete(id);
    el.setAttribute("aria-pressed", on); // Haken-Kreis und Farbe der Zeile folgen per CSS
    setEditHead();
  },
  "set-menu": () => openSetMenu(),
  "set-rename": () => { const set = curSet(); if (set == null) return; closeLayer(); renameSet(set); },
  "set-save": () => saveSetEdit(),
  "set-delete": () => { const set = curSet(); if (set == null || !col) return; closeLayer(); deleteSet(set); },
  "shots-read": () => {
    if (!shots || shots.busy || !shots.items.length) return;
    const images = shots.items.map(i => ({ blob: i.blob, url: i.url }));
    shots = null; // nicht verwerfen, die Fotos gehen jetzt an die KI
    closeLayer();
    if (state.view !== "list") { if (!histToList()) go("list", { nohist: true }); }
    startJob({ mode: "photo", text: "", link: "", images });
    if (state.view === "list") renderListBody();
  },
  "shot-drop": el => {
    if (!shots) return;
    const it = shots.items.splice(Number(el.dataset.i), 1)[0];
    if (it) URL.revokeObjectURL(it.url);
    renderShots();
  },
  "q-read": () => { closeLayer(); if (photoResolve) { photoResolve("read"); photoResolve = null; } },
  "q-again": el => {
    closeLayer();
    const p = document.getElementById(el.dataset.pick); if (p) p.click(); // direkt beim Tippen öffnen, sonst blockt iOS die Auswahl
    if (photoResolve) { photoResolve("again"); photoResolve = null; }
  },
  "modal-yes": () => { closeDialog(); if (modalResolve) { modalResolve(true); modalResolve = null; } },
  "modal-no": () => { closeDialog(); if (modalResolve) { modalResolve(false); modalResolve = null; } },
  start: el => {
    closeLayer();
    const mode = el.dataset.mode;
    if (mode === "manual") openEditor({ isNew: true });
    else startImport(mode);
  },
  filter: el => { state.filter = el.dataset.f; renderListBody(); },
  "open-set": el => openSet(el.dataset.s),
  "set-back": () => { if (history.state && history.state.set && histBack()) return; leaveSet(); },
  "open-recipe": el => openDetail(el.dataset.id),
  back: async () => {
    if (state.view === "detail") { navOwn = Date.now(); if (!histBack()) go("list", { nohist: true }); return; }
    if (state.view === "import") { state.imp = null; if (!histBack()) go("list", { nohist: true }); return; }
    if (state.view === "edit") {
      const ed = state.edit;
      if (ed && ed.dirty) {
        const ok = await confirmDialog({ title: "Änderungen verwerfen?", text: ed.id ? "Was du geändert hast, geht verloren." : "Was du eingegeben hast, geht verloren.", yes: "Verwerfen", danger: true });
        if (!ok) return;
      }
      if (histBack()) return; // zum Rezept oder zur Liste, je nachdem, woher man kam
      state.edit = null;
      if (ed && ed.coverUrl) URL.revokeObjectURL(ed.coverUrl);
      if (ed && ed.id && state.recipes.some(r => r.id === ed.id)) {
        if (state.currentId === ed.id) { go("detail", { nohist: true }); return; } // Haken und Personenzahl bleiben, wie sie waren
        openDetail(ed.id, { nohist: true }); return;
      }
      go("list", { nohist: true });
    }
  },
  fav: async () => {
    const r = current(); if (!r || !col) return;
    const v = !r.favorite;
    patchLocal(r.id, { favorite: v });
    renderDetail();
    try { await withRetry(() => col.doc(r.id).update({ favorite: v })); }
    catch (e) { patchLocal(r.id, { favorite: r.favorite }); renderDetail(); toast(dbErrorText(e)); }
  },
  edit: () => {
    const r = current(); if (!r) return;
    openEditor({ id: r.id, isNew: false, data: toEditData(r) });
  },
  delete: () => removeRecipe(current(), true),
  "add-photo": () => openPhotoSheet(),
  "row-menu": el => openRowMenu(el.dataset.id),
  "row-shop": () => { const r = rowRecipe(); closeLayer(); shopAddRecipe(r, 1); },
  "row-sets": () => { const r = rowRecipe(); if (!r) return; state.currentId = r.id; openSetsFor(r); },
  "row-print": () => { const r = rowRecipe(); closeLayer(); printRecipe(r); },
  "row-delete": () => { const r = rowRecipe(); closeLayer(); removeRecipe(r, false); },
  "shop-add": () => { const r = current(); if (r) shopAddRecipe(r, factorOf(r)); },
  "shop-toggle": el => {
    const x = shopItems().find(i => i.id === el.dataset.id); if (!x) return;
    x.done = !x.done; shopSave();
    el.setAttribute("aria-pressed", x.done); // Haken und Durchstreichen folgen per CSS, die Zeile bleibt an ihrem Platz
  },
  "shop-clear": () => openShopClear(),
  "shop-clear-done": () => { closeLayer(); shopCache = shopItems().filter(x => !x.done); shopSave(); shopRefresh(); toast("Abgehakte entfernt"); },
  "shop-clear-all": async () => {
    closeLayer();
    const ok = await confirmDialog({ title: "Ganze Liste leeren?", text: "Alle Artikel werden von der Einkaufsliste entfernt.", yes: "Leeren", danger: true });
    if (!ok) return;
    shopItems(); shopCache = []; shopSave(); shopRefresh();
  },
  serv: el => {
    const d = Number(el.dataset.d), r = current(), base = r && Number(r.servings) > 0 ? Number(r.servings) : 1;
    const cur = state.servings || 1, next = d > 0 ? Math.floor(cur) + 1 : Math.ceil(cur) - 1; // 1,5 → 2 bzw. 1
    state.servings = Math.min(servMax(base), Math.max(1, next));
    renderDetail();
  },
  factor: el => { state.factor = Number(el.dataset.f); renderDetail(); },
  cook: () => openCook(),
  "cook-close": () => closeCook(),
  "cook-next": () => cookGo(1),
  "cook-prev": () => cookGo(-1),
  "toggle-ing": el => {
    const i = Number(el.dataset.i);
    state.checked.has(i) ? state.checked.delete(i) : state.checked.add(i);
    el.classList.toggle("done"); el.setAttribute("aria-pressed", state.checked.has(i));
  },
  "toggle-step": el => {
    const i = Number(el.dataset.i);
    state.doneSteps.has(i) ? state.doneSteps.delete(i) : state.doneSteps.add(i);
    el.classList.toggle("done"); el.setAttribute("aria-pressed", state.doneSteps.has(i));
  },
  "copy-ings": async () => {
    const r = current(); if (!r) return;
    const base = Number(r.servings) > 0 ? Number(r.servings) : null;
    const factor = base ? state.servings / base : state.factor;
    const lines = (r.ingredients || []).map(l => {
      if (isHead(l)) return "\n" + headText(l) + ":";
      const { qty, rest } = splitQty(l, factor);
      return "• " + qty + rest;
    });
    const head = r.title + (base ? ` (${servText(state.servings, r.category)})` : "");
    try { await navigator.clipboard.writeText(head + "\n" + lines.join("\n").trim()); toast("Zutaten kopiert"); }
    catch (e) { toast("Kopieren wird hier nicht unterstützt."); }
  },
  recognize: () => recognize(),
  "paste-link": async () => {
    let t = "";
    try { t = (await navigator.clipboard.readText()) || ""; } catch (e) { t = ""; }
    const f = $("#imp-link");
    if (!t.trim() || !f || !state.imp) { toast("Nichts kopiert. Halte lange ins Feld und tipp auf „Einfügen“."); if (f) f.focus(); return; }
    const lm = state.imp.mode === "insta" && t.match(/https?:\/\/\S+/);
    const v = lm ? lm[0] : t.trim();
    f.value = v; state.imp.link = v; autosize(f); const st = $("#imp-status"); if (st) st.innerHTML = "";
  },
  save: () => saveRecipe(),
  "remove-cover": () => {
    const ed = state.edit; if (!ed) return;
    if (ed.coverUrl) URL.revokeObjectURL(ed.coverUrl);
    ed.coverBlob = null; ed.coverUrl = null; ed.removeCover = true; ed.dirty = true;
    renderCoverSec();
  }
};

// Spürbares Tippen wie in Apple-Apps (iPhone ab iOS 18): ein unsichtbarer Schalter, dessen Umlegen das iPhone kurz vibrieren lässt
let hapEl = null;
function tick() {
  try {
    if (!hapEl) {
      hapEl = document.createElement("label"); hapEl.setAttribute("aria-hidden", "true");
      hapEl.style.cssText = "position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none";
      const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
      hapEl.appendChild(i); document.body.appendChild(hapEl);
      ["click", "change", "input"].forEach(t => hapEl.addEventListener(t, ev => ev.stopPropagation()));
    }
    hapEl.click();
  } catch (e) { /* egal */ }
}
const TICK = new Set(["fav", "rate", "toggle-ing", "toggle-step", "serv", "factor", "cook-next", "cook-prev"]);
// Nur Ansehen und Blättern: geht schon im Schnellstart. Alles andere (speichern, einlesen, abmelden …) wartet, bis Firebase bereit ist.
const VIEW_ONLY = new Set(["open-recipe", "back", "filter", "sort", "set-sort", "open-set", "set-back", "toggle-ing", "toggle-step", "serv", "factor",
  "cook", "cook-next", "cook-prev", "cook-close", "close-layer", "open-add", "start", "search-clear", "tab", "search-open", "search-close", "set-setsort", "set-menu", "add-photo", "row-menu", "row-shop", "row-print", "shop-add", "shop-toggle", "shop-clear", "shop-clear-done", "shop-clear-all"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action, fn = actions[a];
  if (!fn) return;
  e.preventDefault();
  if (TICK.has(a) && !el.disabled) tick();
  if (!col && quick && !VIEW_ONLY.has(a)) { whenReady().then(() => fn(el, e)); return; }
  fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (layer.classList.contains("open") || layer2.classList.contains("open"))) {
    if (modalResolve) { closeDialog(); modalResolve(false); modalResolve = null; return; }
    if (promptResolve) { endPrompt(null); return; }
    closeLayer();
    if (photoResolve) { photoResolve("cancel"); photoResolve = null; }
    if (viewer) closeViewer();
  }
  if (e.key === "Enter" && e.target && e.target.id === "p-in") { e.preventDefault(); endPrompt(e.target.value || ""); }
});
let searchT = 0;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { if (curSet() == null && state.tab === "sam") state.samQuery = t.value; else state.query = t.value; clearTimeout(searchT); searchT = setTimeout(renderListBody, state.recipes.length > 60 ? 120 : 0); return; }
  if (t.id === "imp-link" && state.imp) { state.imp.link = t.value; autosize(t); const st = $("#imp-status"); if (st && t.value.trim()) st.innerHTML = ""; return; }
  if (t.dataset && t.dataset.k && state.edit) {
    state.edit.data[t.dataset.k] = t.value; state.edit.dirty = true;
    if (t.tagName === "TEXTAREA") autosize(t);
    if (t.dataset.k === "title") { const w = $("#w-title"); if (w) w.classList.remove("bad"); }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.k && state.edit) {
    state.edit.data[t.dataset.k] = t.value; state.edit.dirty = true;
    if (t.dataset.k === "category") {
      const l = $("#w-servings label"), i = $("#f-servings");
      if (l) l.textContent = servWords(t.value).many;
      if (i) i.placeholder = t.value === "Backen" ? "12" : "4";
    }
    return;
  }
  if (t.type !== "file") return;
  const files = t.files;
  if (t.id === "cam-pick") {
    const f = files && files[0]; t.value = "";
    if (f) addShot(f);
    return;
  }
  if (t.dataset.file === "quick") {
    const all = Array.from(files || []), list = all.slice(0, maxImages());
    t.value = "";
    const sf = shotsFor && Date.now() - shotsFor.t < 5 * 60e3 ? shotsFor : null; shotsFor = null; // Screenshots zu einem Reel-Link
    if (!list.length) return;
    closeLayer();
    if (all.length > list.length) toast(`Höchstens ${maxImages()} Fotos pro Rezept. Die ersten ${list.length} werden genommen.`);
    // Direkt im Hintergrund lesen: man bleibt in der Liste und kann weitermachen
    const job = newJob({ mode: "photo", text: "", link: sf ? sf.link : "", images: [] }, "prep");
    if (sf) { const old = state.jobs.find(x => x.id === sf.jobId); if (old) { old.dead = true; if (old.ctl) old.ctl.abort(); removeJob(old); } }
    if (state.view !== "list") { if (!histToList()) go("list", { nohist: true }); } else renderListBody();
    const images = [], weak = []; let bad = 0;
    for (const f of list) {
      try {
        const { img, url } = await loadImg(f); // einmal dekodieren, für Verkleinern und Prüfen
        let blob, q = null;
        try {
          blob = await toJpegImg(img, AI_SIDE, 0.85, AI_PX); // neuere Modelle lesen größere Bilder: kleine Schrift und Handschrift werden deutlich schärfer
          // Screenshots (PNG) sind immer scharf, nur echte Fotos prüfen
          if (!/png/i.test(f.type || "")) { try { q = photoCheckImg(img); } catch (x) { q = null; } }
        } finally { URL.revokeObjectURL(url); }
        images.push({ blob, url: URL.createObjectURL(blob) });
        if (q && (q.dark || q.blurry)) weak.push(Object.assign({ k: images.length - 1 }, q));
        await sleep(0); // zwischendurch zeichnen lassen (Spinner, Liste)
      } catch (err) { bad++; }
    }
    if (bad) toast(bad === 1 ? "Ein Foto ließ sich nicht öffnen." : bad + " Fotos ließen sich nicht öffnen.");
    if (!images.length) { removeJob(job); return; }
    if (job.dead) { images.forEach(i => URL.revokeObjectURL(i.url)); return; }
    if (weak.length && await photoDialog(weak, images, t.id) !== "read") {
      job.dead = true; removeJob(job); images.forEach(i => URL.revokeObjectURL(i.url));
      return;
    }
    if (job.dead) return;
    startJob({ mode: "photo", text: "", link: sf ? sf.link : "", images }, job);
    return;
  }
  if (t.dataset.file === "cover" && files && files[0] && state.edit) {
    try {
      const blob = await toJpeg(files[0], 1600, 0.85);
      const ed = state.edit;
      if (ed.coverUrl) URL.revokeObjectURL(ed.coverUrl);
      ed.coverBlob = blob; ed.coverUrl = URL.createObjectURL(blob); ed.removeCover = false; ed.dirty = true;
      renderCoverSec();
    } catch (err) { toast("Das Foto ließ sich nicht öffnen. Versuch ein anderes."); }
  }
  t.value = "";
});
document.addEventListener("focusin", e => { if (e.target && e.target.id === "q") document.body.classList.add("typing"); });
document.addEventListener("focusout", e => { if (e.target && e.target.id === "q") document.body.classList.remove("typing"); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target && e.target.id === "login-form") loginEmail();
  if (e.target && e.target.id === "shop-form") shopAddText();
});

render();
bootShow();
// Offline-Speicher für die App-Dateien (Rezepte liegen schon im Firestore-Speicher)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Beim Start kam die gespeicherte Kopie, und inzwischen ist eine neue Version da
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "updated") toast("Neue Version geladen. Schließ die App einmal ganz und öffne sie neu."); });
}
</script>
