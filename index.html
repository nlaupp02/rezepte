<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>Rezepte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one-column phone app like a paper recipe notebook. Sticky top bar, two-up recipe grid, full-page detail and editor views. Always light. */
  --bg: #FBF6EC;
  --surface: #FFFFFF;
  --ink: #3A2E1C;
  --muted: #85735A;
  --line: #EDE3CF;
  --accent: #9E680D;
  --accent-ink: #FFFFFF;
  --accent-soft: #F6EAD0;
  --spice: #C2552E;
  --danger: #B3261E;
  --shadow: 0 1px 2px rgba(80, 55, 20, .05), 0 6px 18px rgba(80, 55, 20, .07);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }

.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.filled { fill: currentColor; }

.app { max-width: 720px; margin: 0 auto; padding: 0 16px 128px; }

/* Top bars */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.bar-title { font-size: 18px; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.back {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none;
  color: var(--accent); font-weight: 600; padding: 8px 6px 8px 0; min-height: 44px;
}
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(22px + env(safe-area-inset-top)) 0 14px; }
.brand { font-size: 36px; line-height: 1.05; font-weight: 700; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; text-decoration: none; transition: transform .12s ease, background .12s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { min-height: 38px; padding: 7px 12px; font-size: 15px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; color: var(--muted);
}
.icon-btn.on { color: var(--spice); }

.fab {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 6; display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 22px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; white-space: nowrap;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
}
.fab:active { transform: translateX(-50%) scale(.97); }

/* Search + chips */
.search {
  display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted);
}
.search input { flex: 1; border: 0; background: none; outline: none; height: 100%; color: var(--ink); font-size: 16px; min-width: 0; }
.search:focus-within { border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 14px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink);
}
.chip .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.on .n { color: inherit; opacity: .7; }

/* Grid + cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
}
.card:active { transform: scale(.985); }
.cover { position: relative; aspect-ratio: 4 / 3; background: var(--accent-soft); overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.ph {
  width: 100%; height: 100%; display: grid; place-items: center;
  background:
    radial-gradient(circle at 20% 25%, color-mix(in srgb, var(--accent) 10%, transparent) 0 18%, transparent 19%),
    radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--spice) 14%, transparent) 0 22%, transparent 23%),
    var(--accent-soft);
}
.ph span { font-size: 46px; line-height: 1; }
.fav-badge {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface); color: var(--spice); box-shadow: var(--shadow);
}
.fav-badge .ic { width: 16px; height: 16px; }
.card-body { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; }
.card-title {
  font-weight: 700; font-size: 15px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.none { color: var(--muted); text-align: center; padding: 32px 0; }

.skel { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.skel .cover { background: color-mix(in srgb, var(--line) 60%, var(--surface)); }
.skel .bar { height: 12px; margin: 12px; border-radius: 6px; background: var(--line); width: 70%; }
@media (prefers-reduced-motion: no-preference) {
  .skel { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
}

/* Empty state + option lists */
.empty { padding: 8px 0 24px; }
.empty h2 { font-size: 24px; margin-bottom: 6px; }
.empty p { color: var(--muted); margin: 0 0 18px; max-width: 60ch; }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
}
.opt:active { transform: scale(.99); }
.opt .tile {
  width: 46px; height: 46px; border-radius: 13px; flex: none; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.opt .tile .ic { width: 23px; height: 23px; }
.opt b { display: block; font-size: 16px; }
.opt small { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; }

/* Status boxes */
.status {
  display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  font-size: 15px; line-height: 1.4;
}
.status b { display: block; }
.status > div { flex: 1; min-width: 0; }
.status span.d { color: var(--muted); display: block; }
.status.warn { border-left-color: var(--spice); }
.status.err { border-left-color: var(--danger); }
.status.ok .ic { color: var(--accent); margin-top: 1px; }
.spinner {
  width: 22px; height: 22px; flex: none; border-radius: 50%;
  border: 3px solid var(--accent-soft); border-top-color: var(--accent); margin-top: 1px;
}
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }

/* Forms / import */
.stack { display: grid; gap: 16px; padding-top: 6px; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.howto { margin: 0; padding: 0; list-style: none; counter-reset: h; display: grid; gap: 10px; }
.howto li {
  counter-increment: h; position: relative; padding: 12px 14px 12px 52px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; line-height: 1.4;
}
.howto li::before {
  content: counter(h); position: absolute; left: 14px; top: 11px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px;
}
.howto b { display: block; }
.pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick-row.one { grid-template-columns: 1fr; }
.tilebtn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 92px; border-radius: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line));
  background: var(--surface); color: var(--accent); font-weight: 700; text-align: center; padding: 10px;
}
.tilebtn .ic { width: 26px; height: 26px; }
.tilebtn:active { background: var(--accent-soft); }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
.thumbs:empty { display: none; }
.thumb {
  position: relative; flex: none; width: 92px; height: 120px; margin: 0; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line); background: var(--surface); padding: 0;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .num {
  position: absolute; left: 6px; bottom: 6px; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: rgba(0,0,0,.6); color: #fff;
}
.thumb-x {
  position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; border-radius: 50%; border: 0;
  display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; padding: 0;
}
.thumb-x .ic { width: 16px; height: 16px; }
.thumb.loading { display: grid; place-items: center; }
.thumbs.small .thumb { width: 64px; height: 64px; }
.thumb.sel.on { outline: 3px solid var(--accent); outline-offset: 1px; }

.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 700; font-size: 15px; }
.field .hint { color: var(--muted); font-size: 13px; margin-top: -2px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.45;
}
.field textarea { resize: vertical; min-height: 96px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input { border-color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .row3 { grid-template-columns: 1fr 1fr; } .row3 .field:first-child { grid-column: 1 / -1; } }

.cover-edit { display: grid; gap: 10px; }
.cover-prev { aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: var(--accent-soft); }
.cover-prev img { width: 100%; height: 100%; object-fit: cover; }
.cover-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pick-cover { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }

/* Detail */
.detail { display: grid; gap: 18px; padding-top: 4px; }
.hero { aspect-ratio: 16 / 10; max-height: 340px; width: 100%; border-radius: 20px; overflow: hidden; background: var(--accent-soft); }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .ph span { font-size: 72px; }
.d-title { font-size: 30px; line-height: 1.12; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -6px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600;
}
.pill .ic { width: 16px; height: 16px; color: var(--muted); }
.pill.cat { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.src { font-size: 14px; color: var(--muted); margin-top: -8px; overflow-wrap: anywhere; }
.src a { color: var(--accent); font-weight: 600; }
.sec { display: grid; gap: 10px; }
.sec h2 { font-size: 21px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.scaler {
  display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden;
}
.scaler button { width: 42px; height: 40px; border: 0; background: none; font-size: 20px; font-weight: 600; color: var(--accent); }
.scaler span { padding: 0 6px; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 12px; font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ings li + li { border-top: 1px solid var(--line); }
.ing {
  width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 11px 14px; border: 0; background: none; font-size: 16px; line-height: 1.4;
}
.ing .box {
  width: 22px; height: 22px; flex: none; margin-top: 1px; border-radius: 7px; border: 2px solid var(--line);
  display: grid; place-items: center; color: transparent;
}
.ing .box .ic { width: 14px; height: 14px; stroke-width: 3; }
.ing b { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.ing.done { color: var(--muted); }
.ing.done .ing-t { text-decoration: line-through; }
.ing.done b { color: var(--muted); }
.ing.done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ing-h { padding: 12px 14px 6px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step {
  width: 100%; display: flex; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1.5;
}
.step .no {
  width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}
.step.done { color: var(--muted); }
.step.done .no { background: var(--accent); color: var(--accent-ink); }
.step-h { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 2px 0; }
.notes { margin: 0; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; }
.muted { color: var(--muted); margin: 0; }

/* Layer: sheet, modal */
#layer { position: fixed; inset: 0; z-index: 20; display: none; }
#layer.open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(10, 16, 12, .45); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 720px; margin: 0 auto;
  background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
  display: grid; gap: 12px; max-height: 90%; overflow-y: auto;
}
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet h2 { font-size: 21px; }
.modal {
  position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 400px; margin: 0 auto;
  background: var(--surface); border-radius: 18px; padding: 20px; display: grid; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.modal h2 { font-size: 20px; }
.modal p { margin: 0; color: var(--muted); }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) {
  #layer.open .sheet { animation: up .22s ease-out; }
  #layer.open .scrim { animation: fade .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } }
  @keyframes fade { from { opacity: 0; } }
}

.login { display: grid; gap: 16px; max-width: 440px; margin: 0 auto; padding: calc(44px + env(safe-area-inset-top)) 0 40px; }
.login.boot { justify-items: center; padding-top: calc(120px + env(safe-area-inset-top)); }
.login .brand { font-size: 44px; }
.lg-h { font-size: 20px; }
.gbtn { gap: 10px; min-height: 50px; font-size: 16px; }
.gbtn .ic { width: 20px; height: 20px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.login-links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; margin-top: -6px; }
.login-links .btn { padding: 8px 4px; font-size: 15px; }
.login .btn.primary { min-height: 50px; }
.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  z-index: 30; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app" class="app"></div>
<input class="vh" id="quick-pick" type="file" accept="image/*" multiple data-file="quick" aria-label="Rezeptfoto auswählen">
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- Basics ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const app = $("#app");
const layer = $("#layer");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

const CATEGORIES = ["Frühstück", "Hauptgericht", "Beilage", "Salat", "Suppe", "Snack", "Dessert", "Backen", "Getränk", "Sonstiges"];

const ICONS = {
  camera: '<path d="M4 8.5h3.2L9 6h6l1.8 2.5H20v10.5H4z"/><circle cx="12" cy="13.5" r="3.6"/>',
  image: '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 15.5l-4.5-4.5-8.5 8"/>',
  reel: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 8.8v6.4l5.3-3.2z"/>',

// Wartet auf die Bestätigung vom Server, höchstens 3 s. Danach bleibt die Änderung

function fsWrite(p) {
  return new Promise((res, rej) => {
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; res(); } }, 3000);
    p.then(() => { if (!done) { done = true; clearTimeout(t); res(); } },
      e => {

}

}

function makeSample(model) {
  const s = async () => { throw { code: "invalid_request" }; };
  s.limits = async () => sampleLimits;
  s.json = async (prompt, opts = {}) => {
    const signal = opts.signal;
    const parts = [{ text: prompt }];

      parts.push({ inlineData: { mimeType: "image/jpeg", data: String(await blobToDataUrl(b)).split(",")[1] } });
    }
    if (signal && signal.aborted) throw { code: "cancelled" };
    const call = model.generateContent(parts).then(r => r.response.text());
    const stop = new Promise((_, rej) => { if (signal) signal.addEventListener("abort", () => rej({ code: "cancelled" }), { once: true }); });
    let text;
    try { text = await Promise.race([call, stop]); }
    catch (e) { if (e && e.code === "cancelled") throw e; console.warn("Gemini", e); throw mapAiErr(e); }
    if (signal && signal.aborted) throw { code: "cancelled" };
    try { return JSON.parse(text); }
    catch (e) {

function mapAiErr(e) {

  if (/429|quota|RESOURCE_EXHAUSTED|rate.?limit/i.test(msg)) return { code: "rate_limited", message: msg };
  if (/403|PERMISSION_DENIED|SERVICE_DISABLED|not been used|has not been enabled|api-not-enabled|disabled/i.test(msg)) return { code: "ai_off", message: msg };
  if (/SAFETY|blocked|PROHIBITED/i.test(msg)) return { code: "refused", message: msg };
  if (/too large|payload|413/i.test(msg)) return { code: "image_rejected", message: msg };
  return { code: "upstream_error", message: msg };
}

const FRAC = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": .125 };
const NUM = "(?:\\d+(?:[.,]\\d+)?\\s*[½¼¾⅓⅔⅛]|\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔⅛])";
const QTY_RE = new RegExp("^(" + NUM + ")(?:(\\s*[-–]\\s*)(" + NUM + "))?");
function toNum(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])$/))) return +m[1] + FRAC[m[2]];
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if (FRAC[s] != null) return FRAC[s];
  return parseFloat(s.replace(",", "."));
}
function fmtNum(n) {
  if (!isFinite(n)) return "";
  if (n >= 100) return String(Math.round(n / 5) * 5);
  if (n >= 10) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const nice = [[0, ""], [.25, "¼"], [1 / 3, "⅓"], [.5, "½"], [2 / 3, "⅔"], [.75, "¾"], [1, ""]];
  for (const [v, sym] of nice) {
    if (Math.abs(frac - v) < 0.04) {
      const w = v === 1 ? whole + 1 : whole;
      if (!sym) return String(w);
      return (w ? String(w) : "") + sym;
    }
  }
  return String(Math.round(n * 10) / 10).replace(".", ",");
}
function splitQty(line, factor) {
  const m = line.match(QTY_RE);
  if (!m) return { qty: "", rest: line };
  let qty = m[0];
  if (factor !== 1 && !/^\s*(prise|msp|messerspitze|schuss|spritzer|etwas)\b/i.test(line.slice(m[0].length))) {
    const a = fmtNum(toNum(m[1]) * factor);

}

  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", q));
}
const blobToDataUrl = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });

async function storeCover(blob) {
  if (assets) {
    try {
      const big = await toJpeg(blob, 1200, 0.82);
      const r = await assets.upload(big);
      if (r && r.id) return { assetId: r.id };
    } catch (e) { /* fall back to an inline copy */ }
  }
  const small = await toJpeg(blob, 640, 0.72);
  return { dataUrl: await blobToDataUrl(small) };
}

function linesOf(s) {
  return String(s || "").split(/\n/).map(x => x.replace(/^\s*[-•*–]\s+/, "").trim()).filter(Boolean);
}
async function saveRecipe() {
  const ed = state.edit;
  if (!ed || ed.saving) return;
  const d = ed.data;
  const title = d.title.trim();
  if (!title) {
    const w = $("#w-title"); if (w) { w.classList.add("bad"); $("#f-title").focus(); }
    toast("Gib dem Rezept einen Titel.");
    return;
  }
  if (!col) { toast("Melde dich an, um Rezepte zu speichern."); return; }
  ed.saving = true;
  $$("[data-action=save]").forEach(b => { b.disabled = true; b.textContent = "Speichert …"; });
  try {
    let cover = d.cover || null, oldAsset = null;
    if (ed.coverBlob) {
      const nc = await storeCover(ed.coverBlob);
      if (cover && cover.assetId) oldAsset = cover.assetId;
      cover = nc;
    } else if (ed.removeCover) {
      if (cover && cover.assetId) oldAsset = cover.assetId;
      cover = null;
    }
    const sv = parseFloat(String(d.servings).replace(",", "."));
    const now = Date.now();
    const doc = {
      title, category: d.category, emoji: d.emoji || "",
      servings: sv > 0 && sv < 1000 ? sv : null,
      prepTime: d.prepTime.trim(), cookTime: d.cookTime.trim(),
      ingredients: linesOf(d.ingredientsText), steps: linesOf(d.stepsText).map(s => s.replace(/^\d+[.)]\s*/, "")),
      notes: d.notes.trim(), source: d.source.trim(), link: d.link.trim(),
      favorite: !!d.favorite, cover, createdAt: d.createdAt || now, updatedAt: now
    };
    const id = ed.id || newId();
    await withRetry(() => col.doc(id).set(doc));
    if (oldAsset && assets) assets.delete(oldAsset).catch(() => {});
    const i = state.recipes.findIndex(r => r.id === id);
    const local = Object.assign({ id }, doc);
    if (i >= 0) state.recipes[i] = local; else state.recipes.unshift(local);
    const fromImport = ed.fromImport;
    state.edit = null;
    if (fromImport) state.imp = null;
    openDetail(id);
    toast("Gespeichert");
  } catch (e) {
    ed.saving = false;
    $$("[data-action=save]").forEach((b, k) => { b.disabled = false; b.textContent = k ? "Rezept speichern" : "Speichern"; });
    toast(e && e.code ? dbErrorText(e) : "Das Foto ließ sich nicht verarbeiten. Nimm ein anderes oder speichere ohne Foto.");
  }
}

      </div>
      <div id="imp-status" aria-live="polite"></div>
      <button class="btn primary block" id="recognize" data-action="recognize" ${aiAvailable() ? "" : "disabled"}>Rezept erkennen</button>
      <button class="btn quiet block" data-action="manual-from-import">Lieber selbst eintippen</button>
    </main>`;
  renderThumbs();
  const ta = $("#imp-text"); if (ta) autosize(ta);
  if (imp.busy) showBusy();
}
function renderThumbs() {
  const el = $("#thumbs"), imp = state.imp;
  if (!el || !imp) return;
  el.innerHTML = imp.images.map((im, i) =>
    `<figure class="thumb"><img src="${esc(im.url)}" alt="Bild ${i + 1}"><span class="num">${i + 1}</span>
      <button class="thumb-x" data-action="remove-img" data-i="${i}" aria-label="Bild ${i + 1} entfernen">${icon("x")}</button></figure>`).join("")
    + Array.from({ length: imp.processing }, () => `<figure class="thumb loading"><span class="spinner"></span></figure>`).join("");
}
async function addImportFiles(files) {
  const imp = state.imp;
  if (!imp) return;
  const max = maxImages();
  let list = Array.from(files || []);
  const room = max - imp.images.length - imp.processing;
  if (list.length > room) { toast(`Höchstens ${max} Bilder pro Rezept.`); list = list.slice(0, Math.max(0, room)); }
  for (const f of list) {
    imp.processing++; renderThumbs();
    try {
      const blob = await toJpeg(f, 1800, 0.86);
      imp.images.push({ blob, url: URL.createObjectURL(blob) });
    } catch (e) {
      toast("Ein Bild ließ sich nicht öffnen. Versuch ein anderes.");
    }
    imp.processing--; renderThumbs();
  }
}
function setStatus(html) { const el = $("#imp-status"); if (el) el.innerHTML = html; }
function showBusy(detail) {
  setStatus(`<div class="status"><span class="spinner"></span><div><b>Rezept wird gelesen …</b>
    <span class="d" id="busy-detail">${esc(detail || "Das dauert meist 5 bis 20 Sekunden.")}</span></div>
    <button class="btn small" data-action="stop">Stopp</button></div>`);
  const b = $("#recognize"); if (b) b.disabled = true;
}
function showError(title, text) {
  setStatus(`<div class="status err"><div><b>${esc(title)}</b>${text ? `<span class="d">${esc(text)}</span>` : ""}</div></div>`);
  const b = $("#recognize"); if (b) b.disabled = !aiAvailable();
}

function buildPrompt(imp, n) {
  const t = imp.text.trim();
  let material;
  if (imp.mode === "insta") {
    material = `Das Material stammt aus einem Instagram-Reel oder -Post` +
      (n ? `: ${n} Screenshot(s) (Bild 1 bis ${n}) aus dem Video und/oder der Beschreibung` : "") +
      (t ? (n ? ", dazu" : ":") + " die kopierte Beschreibung (unten)" : "") +
      `. Text-Einblendungen im Video gehören auch zum Rezept.`;
  } else if (imp.mode === "photo") {
    material = `Das Material sind ${n} Foto(s) (Bild 1 bis ${n}) eines Rezepts, z. B. aus einem Kochbuch, einer Zeitschrift, von einem Zettel oder handschriftlich. Mehrere Bilder gehören zum selben Rezept.`;
  } else {
    material = `Das Material ist ein eingefügter Text` + (n ? ` und ${n} Bild(er)` : "") + `.`;
  }
  return `Du hilfst einer Kochbuch-App, Rezepte zu speichern. ${material}

Lies das Rezept heraus und antworte nur mit einem JSON-Objekt mit diesen Feldern:
- "isRecipe": true oder false
- "problem": leer, oder kurz auf Deutsch, warum kein Rezept erkennbar ist (z. B. unscharf, abgeschnitten, nur ein Video-Standbild ohne Text)
- "title": kurzer, klarer Rezeptname auf Deutsch
- "category": genau eins von: ${CATEGORIES.join(", ")}
- "emoji": ein passendes Essens-Emoji
- "servings": Anzahl Portionen als Zahl, oder null
- "prepTime": Vorbereitungszeit wie "15 Min." oder "1 Std. 10 Min.", sonst ""
- "cookTime": Koch- bzw. Backzeit im selben Format, sonst ""
- "ingredients": Liste von Strings, eine Zutat pro Eintrag, Menge zuerst, z. B. "200 g Mehl", "2 EL Olivenöl", "1 Prise Salz". Zwischenüberschriften als eigener Eintrag mit "# " davor, z. B. "# Für die Soße".
- "steps": Liste von Strings, ein Arbeitsschritt pro Eintrag, ohne Nummerierung
- "notes": Tipps oder Hinweise aus dem Rezept, sonst ""
- "source": Buchtitel, Website oder Instagram-Kanal (z. B. "@kanalname"), falls erkennbar, sonst ""
- "coverImage": Nummer des Bildes (ab 1), das das fertige Gericht gut zeigt, sonst null

Regeln:
- Schreib alles auf Deutsch. Ist das Rezept in einer anderen Sprache, übersetze es.
- Rechne amerikanische Maße in metrische um (cups in g oder ml, oz und lb in g, °F in °C, tbsp in EL, tsp in TL) und runde sinnvoll.
- Übernimm nur, was wirklich im Material steht. Erfinde keine Zutaten oder Mengen. Unleserliche Stellen markierst du mit [?].
- Fehlen die Zubereitungsschritte, lass "steps" leer und schreib in "notes", dass die Zubereitung nur im Video gezeigt wird oder fehlt.
- Lass Hashtags, Werbung, „Link in Bio“, Rabattcodes, Emojis und Danksagungen weg.
- Stehen mehrere Rezepte im Material, nimm das Hauptrezept und erwähne die anderen kurz in "notes".` +
    (imp.mode === "photo" && t ? `\n\nHinweis des Nutzers: ${t}` : "") +
    (imp.mode !== "photo" && t ? `\n\nEingefügter Text:\n<<<\n${t.slice(0, 20000)}\n>>>` : "");
}
const str = v => typeof v === "string" ? v.trim() : (typeof v === "number" ? String(v) : "");
function arr(v) {
  if (typeof v === "string") v = v.split(/\n+/);
  if (!Array.isArray(v)) return [];
  return v.map(x => typeof x === "string" ? x
      : (x && typeof x === "object" ? [x.amount, x.unit, x.name].filter(y => y != null && y !== "").join(" ") : String(x ?? "")))
    .map(s => s.replace(/^\s*[-•*]\s+/, "").trim()).filter(Boolean);
}
function resultToEdit(res, imp) {
  const d = blankData();
  d.title = str(res.title) || "Neues Rezept";
  d.category = CATEGORIES.includes(res.category) ? res.category : "Sonstiges";
  d.emoji = Array.from(str(res.emoji)).slice(0, 3).join("");
  const sv = Number(res.servings);
  d.servings = sv > 0 && sv < 1000 ? String(Math.round(sv * 10) / 10).replace(".", ",") : "";
  d.prepTime = str(res.prepTime); d.cookTime = str(res.cookTime);
  d.ingredientsText = arr(res.ingredients).join("\n");
  d.stepsText = arr(res.steps).map(s => s.replace(/^(\d+[.)]|schritt\s*\d+:?)\s*/i, "")).join("\n");
  d.notes = str(res.notes);
  d.source = str(res.source) || (imp.mode === "insta" ? "Instagram" : "");
  d.link = imp.link.trim();
  let ci = Number(res.coverImage);
  ci = Number.isInteger(ci) && ci >= 1 && ci <= imp.images.length ? ci - 1 : -1;
  const pick = ci >= 0 ? imp.images[ci] : null;
  return { data: d, coverBlob: pick ? pick.blob : null, coverUrl: pick ? pick.url : null };
}
async function recognize() {
  const imp = state.imp;
  if (!imp || imp.busy) return;
  await initPromise;
  if (!sample) { renderImport(); return; }
  if (imp.processing) { toast("Einen Moment, die Bilder werden noch vorbereitet."); return; }
  const imgs = imagesAllowed() ? imp.images.map(i => i.blob) : [];
  const t = imp.text.trim();
  if (!imgs.length && t.length < 15) {
    showError(imp.mode === "text" ? "Füg zuerst den Rezepttext ein." : "Füg zuerst ein Foto hinzu.", imp.mode === "insta" ? "Screenshots vom Reel oder die kopierte Beschreibung reichen." : "");
    return;
  }
  imp.busy = true;
  const ctl = new AbortController(); imp.ctl = ctl;
  showBusy();
  const opts = {
    signal: ctl.signal, cache: false, modelTier: "default",
    onText: ({ text }) => {
      const m = text.match(/"title"\s*:\s*"([^"]{2,80})"/);
      const el = $("#busy-detail");
      if (m && el) el.textContent = "Gefunden: " + m[1];
    }
  };
  if (imgs.length) opts.images = imgs;
  try {
    const res = await sample.json(buildPrompt(imp, imgs.length), opts);
    imp.busy = false; imp.ctl = null;
    if (state.imp !== imp) return;
    if (!res || typeof res !== "object" || res.isRecipe === false) {
      showError("Kein Rezept erkannt", str(res && res.problem) || "Versuch ein schärferes Foto oder füg den Text ein.");
      return;
    }
    const conv = resultToEdit(res, imp);
    if (!linesOf(conv.data.ingredientsText).length && !linesOf(conv.data.stepsText).length) {
      showError("Kein Rezept erkannt", str(res.problem) || "Weder Zutaten noch Schritte waren lesbar. Versuch ein schärferes Foto.");
      return;
    }
    openEditor({ isNew: true, data: conv.data, coverBlob: conv.coverBlob, coverUrl: conv.coverUrl, fromImport: true, importImages: imp.images.slice(), dirty: true });
  } catch (e) {
    imp.busy = false; imp.ctl = null;
    if (state.imp !== imp) return;
    const c = e && e.code;
    if (c === "cancelled") { setStatus(""); const b = $("#recognize"); if (b) b.disabled = false; return; }
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) {
      sample = null; renderImport(); return;
    }
    if (c === "images_unavailable") { sampleLimits = Object.assign({}, sampleLimits, { images: undefined }); renderImport(); showError("Bilder gehen hier gerade nicht.", "Füg stattdessen den Rezepttext ein."); return; }
    const msg = {
      rate_limited: ["Gerade zu viele Anfragen", "Oder dein Claude-Limit ist erreicht. Versuch es später nochmal."],
      session_expired: ["Bitte neu anmelden", "Melde dich in Claude neu an und versuch es dann nochmal."],
      image_rejected: ["Ein Bild ließ sich nicht lesen", "Entfern es oder nimm ein anderes Foto."],
      refused: ["Das konnte Claude nicht verarbeiten", "Versuch ein anderes Foto oder einen anderen Text."],
      prompt_too_large: ["Der Text ist zu lang", "Kürz ihn auf das eigentliche Rezept."],
      invalid_json: ["Die Antwort kam unvollständig an", "Tipp nochmal auf „Rezept erkennen“."],
      empty_completion: ["Keine Antwort erhalten", "Tipp nochmal auf „Rezept erkennen“."],
      ai_off: ["Fotos lesen ist noch nicht eingeschaltet", "In Firebase unter „AI Logic“ die Gemini Developer API aktivieren."],
      offline: ["Keine Internetverbindung", "Zum Lesen der Fotos brauchst du Internet. Versuch es gleich nochmal."]
    }[c] || ["Verbindung unterbrochen", "Tipp nochmal auf „Rezept erkennen“."];
    showError(msg[0], msg[1]);
  }
}

/* ---------- Actions ---------- */
const actions = {
  "open-add": () => openSheet(),
  "login-google": () => loginGoogle(),
  "lg-mode": el => {
    const L = state.login || (state.login = { mode: "in", email: "" });
    const m = $("#lg-mail"); if (m) L.email = m.value.trim();
    L.mode = el.dataset.m; L.err = ""; L.msg = "";
    renderLogin();
    const f = $("#lg-mail"); if (f && !L.email) f.focus();
  },
  account: () => openAccount(),
  logout: async () => {
    closeLayer();
    try { await fb.U.signOut(fb.auth); } catch (e) { toast("Abmelden hat nicht geklappt. Versuch es nochmal."); }
  },
  reload: () => location.reload(),
  "close-layer": () => closeLayer(),
  "modal-yes": () => { closeLayer(); if (modalResolve) { modalResolve(true); modalResolve = null; } },
  "modal-no": () => { closeLayer(); if (modalResolve) { modalResolve(false); modalResolve = null; } },
  start: el => {
    closeLayer();
    const mode = el.dataset.mode;
    if (mode === "manual") openEditor({ isNew: true });
    else startImport(mode);
  },
  filter: el => { state.filter = el.dataset.f; renderListBody(); },
  "open-recipe": el => openDetail(el.dataset.id),
  back: async () => {
    if (state.view === "detail") { go("list"); return; }
    if (state.view === "import") {
      if (state.imp && state.imp.ctl) state.imp.ctl.abort();
      state.imp = null; go("list"); return;
    }
    if (state.view === "edit") {
      const ed = state.edit;
      if (ed && ed.dirty) {
        const ok = await confirmDialog({ title: "Änderungen verwerfen?", text: ed.fromImport ? "Das erkannte Rezept wird nicht gespeichert." : "Was du geändert hast, geht verloren.", yes: "Verwerfen", danger: true });
        if (!ok) return;
      }
      state.edit = null;
      if (ed && ed.fromImport && state.imp) { go("import"); return; }
      if (ed && ed.id && state.recipes.some(r => r.id === ed.id)) { openDetail(ed.id); return; }
      go("list");
    }
  },
  fav: async () => {
    const r = current(); if (!r || !col) return;
    const v = !r.favorite;
    const i = state.recipes.indexOf(r);
    state.recipes[i] = Object.assign({}, r, { favorite: v });
    renderDetail();
    try { await withRetry(() => col.doc(r.id).update({ favorite: v })); }
    catch (e) { state.recipes[i] = r; renderDetail(); toast(dbErrorText(e)); }
  },
  edit: () => {
    const r = current(); if (!r) return;
    openEditor({ id: r.id, isNew: false, data: toEditData(r) });
  },
  delete: async () => {
    const r = current(); if (!r || !col) return;
    const ok = await confirmDialog({ title: "Rezept löschen?", text: `„${r.title}“ wird endgültig entfernt.`, yes: "Löschen", danger: true });
    if (!ok) return;
    try {
      await withRetry(() => col.doc(r.id).delete());
      if (r.cover && r.cover.assetId && assets) assets.delete(r.cover.assetId).catch(() => {});
      state.recipes = state.recipes.filter(x => x.id !== r.id);
      go("list"); toast("Rezept gelöscht");
    } catch (e) { toast(dbErrorText(e)); }
  },
  serv: el => {
    const d = Number(el.dataset.d);
    state.servings = Math.max(1, Math.round((state.servings || 1) + d));
    renderDetail();
  },
  factor: el => { state.factor = Number(el.dataset.f); renderDetail(); },
  "toggle-ing": el => {
    const i = Number(el.dataset.i);
    state.checked.has(i) ? state.checked.delete(i) : state.checked.add(i);
    el.classList.toggle("done"); el.setAttribute("aria-pressed", state.checked.has(i));
  },
  "toggle-step": el => {
    const i = Number(el.dataset.i);
    state.doneSteps.has(i) ? state.doneSteps.delete(i) : state.doneSteps.add(i);
    renderDetail();
  },
  "copy-ings": async () => {
    const r = current(); if (!r) return;
    const base = Number(r.servings) > 0 ? Number(r.servings) : null;
    const factor = base ? state.servings / base : state.factor;
    const lines = (r.ingredients || []).map(l => {
      if (isHead(l)) return "\n" + headText(l) + ":";
      const { qty, rest } = splitQty(l, factor);
      return "• " + qty + rest;
    });
    const head = r.title + (base ? ` (${fmtNum(state.servings)} Portionen)` : "");
    try { await navigator.clipboard.writeText(head + "\n" + lines.join("\n").trim()); toast("Zutaten kopiert"); }
    catch (e) { toast("Kopieren wird hier nicht unterstützt."); }
  },
  "remove-img": el => {
    const imp = state.imp; if (!imp || imp.busy) return;
    const i = Number(el.dataset.i);
    const [im] = imp.images.splice(i, 1);
    if (im) setTimeout(() => URL.revokeObjectURL(im.url), 1000);
    renderThumbs();
  },
  recognize: () => recognize(),
  stop: () => { if (state.imp && state.imp.ctl) state.imp.ctl.abort(); },
  "manual-from-import": () => {
    const imp = state.imp;
    const d = blankData();
    if (imp && imp.ctl) imp.ctl.abort();
    openEditor({ isNew: true, data: d, fromImport: !!imp, importImages: imp ? imp.images.slice() : [], coverBlob: null, dirty: !!(imp && imp.images.length) });
  },
  save: () => saveRecipe(),
  "remove-cover": () => {
    const ed = state.edit; if (!ed) return;
    ed.coverBlob = null; ed.coverUrl = null; ed.removeCover = true; ed.dirty = true;
    renderCoverSec();
  },
  "use-import-cover": el => {
    const ed = state.edit; if (!ed) return;
    const im = ed.importImages[Number(el.dataset.i)]; if (!im) return;
    ed.coverBlob = im.blob; ed.coverUrl = im.url; ed.removeCover = false; ed.dirty = true;
    renderCoverSec();
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && layer.classList.contains("open")) {
    closeLayer();
    if (modalResolve) { modalResolve(false); modalResolve = null; }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { state.query = t.value; renderListBody(); return; }
  if (t.id === "imp-text" && state.imp) { state.imp.text = t.value; autosize(t); return; }
  if (t.id === "imp-link" && state.imp) { state.imp.link = t.value; return; }
  if (t.dataset && t.dataset.k && state.edit) {
    state.edit.data[t.dataset.k] = t.value; state.edit.dirty = true;
    if (t.tagName === "TEXTAREA") autosize(t);
    if (t.dataset.k === "title") { const w = $("#w-title"); if (w) w.classList.remove("bad"); }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.k && state.edit) { state.edit.data[t.dataset.k] = t.value; state.edit.dirty = true; return; }
  if (t.type !== "file") return;
  const files = t.files;
  if (t.dataset.file === "quick") {
    const list = Array.from(files || []);
    t.value = "";
    if (!list.length) return;
    startImport("photo");
    await addImportFiles(list);
    renderImport();
    return;
  }
  if (t.dataset.file === "import") { await addImportFiles(files); if (state.view === "import") renderImport(); }
  else if (t.dataset.file === "cover" && files && files[0] && state.edit) {
    try {
      const blob = await toJpeg(files[0], 1600, 0.85);
      const ed = state.edit;
      ed.coverBlob = blob; ed.coverUrl = URL.createObjectURL(blob); ed.removeCover = false; ed.dirty = true;
      renderCoverSec();
    } catch (err) { toast("Das Foto ließ sich nicht öffnen. Versuch ein anderes."); }
  }
  t.value = "";
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target && e.target.id === "login-form") loginEmail();
});

render();
</script>
</body>
